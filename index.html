<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<title>Joyeux Anniversaire</title><style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff9acb,#ff6fa5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
}

/* Cadeau */
#gift{
font-size:100px;
cursor:pointer;
}

/* Contenu caché au départ */
#content{
display:none;
}

/* Carte anniversaire */
.card{
background:white;
color:#333;
padding:30px;
border-radius:20px;
max-width:400px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* Image */
.card img{
width:200px;
height:200px;
object-fit:cover;
border-radius:50%;
border:5px solid #ff6fa5;
margin-bottom:20px;
}

h1{
color:#ff4f8b;
}

</style></head><body><!-- Cadeau --><div id="gift">🎁</div><!-- Contenu anniversaire --><div id="content"><div class="card"><img src="photo.jpg"><h1>Joyeux Anniversaire 🎂</h1><p>
Je te souhaite beaucoup de bonheur,<br>
de réussite et d'amour ❤️
</p><p>
Que cette journée soit remplie de joie<br>
et de beaux moments.
</p></div></div><!-- Musique --><audio id="music">
<source src="Happy Birthday(MP3_160K).mp3" type="audio/mpeg">
</audio><script>

const gift = document.getElementById("gift");
const content = document.getElementById("content");
const music = document.getElementById("music");

gift.addEventListener("click", function(){

gift.style.display = "none";
content.style.display = "block";

music.play();

});

</script></body>
</html>
